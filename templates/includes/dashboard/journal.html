<div class="bg-white rounded-3xl shadow-md p-8">

    <!-- Header -->

    <div class="flex items-center justify-between">

        <div>

            <h2 class="text-2xl font-bold text-gray-900">
                Quick Journal
            </h2>

            <p class="text-gray-500 mt-1">
                Tell us how you're feeling today.
            </p>

        </div>

        <span class="bg-teal-100 text-teal-700 text-sm font-medium px-4 py-2 rounded-full">

            ✨ AI Analysis

        </span>

    </div>

    <!-- Form -->

    <form method="POST"
          action="{% url 'journal' %}"
          class="mt-8 space-y-5">

        {% csrf_token %}

        <textarea
            name="journal"
            rows="5"
            required
            class="w-full rounded-2xl border border-gray-200 p-5 resize-none text-gray-700 placeholder:text-gray-400 focus:border-teal-500 focus:ring-4 focus:ring-teal-100 focus:outline-none transition"
            placeholder="Example: I've been feeling stressed lately because of work and my neck feels stiff..."></textarea>

        <div class="flex justify-end">

            <button
                type="submit"
                class="inline-flex items-center gap-2 bg-teal-600 text-white px-7 py-3 rounded-2xl font-semibold hover:bg-teal-700 transition">

                Analyze Emotion →

            </button>

        </div>

    </form>

</div>
